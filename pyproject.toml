[project]
name = "volatility-regime-forecasting"
version = "0.1.0"
description = "Volatility regime and realized-vol forecasting for single-name equities, with implied-vol comparison and option risk"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "joblib>=1.3",
    "lightgbm>=4.0",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.6",
    "scipy>=1.11",
    "seaborn>=0.12",
    "statsmodels>=0.14",
    "ta>=0.11",
    "xgboost>=2.0",
    "yfinance>=0.2",
]

[dependency-groups]
dev = [
    "defusedxml>=0.7",
    "hypothesis>=6.112",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.7",
    "types-defusedxml>=0.7",
]
notebooks = [
    "ipykernel>=6.25",
    "jupyter>=1.0",
    "shap>=0.44",
]
oracle = [
    "quantlib>=1.36",
]

[tool.uv]
package = false
default-groups = ["dev", "oracle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "-ra", "-m", "not network"]
timeout = 300
markers = [
    "oracle: cross-checks against QuantLib",
    "network: downloads live data, deselected by default (run with -m network)",
]

# Lint, format and type checks cover the test-gate tooling. The research code in src/,
# scripts/ and its tests is added to these lists when it is refactored into a package, so
# those files stay untouched until then.
[tool.ruff]
line-length = 100
target-version = "py312"
include = ["scripts/verify_required_tests.py", "tests/tooling/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PT", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
files = ["scripts/verify_required_tests.py", "tests/tooling"]
